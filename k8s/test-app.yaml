apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: jmeter-live
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=ok"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: test-app
  namespace: jmeter-live
spec:
  selector:
    app: test-app
  ports:
    - port: 8080
      targetPort: 8080
